[package]
name = "music"
version = "0.1.0"
edition = "2024"
description = "mpv music player wrapper with an rclone mount and a TUI"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
walkdir = "2"

# Keep rebuilds quick; the heavy work is in external mpv/rclone processes.
[profile.release]
codegen-units = 16
lto = false
